<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Bilgisi - Kelime Tahmin Oyunu</title>
    <meta name="description" content="Türkçe kelime bilgisini test eden eğlenceli bir kelime tahmin oyunu.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <h1 class="logo">📖 Kelime Bilgisi</h1>
        </div>
        <div class="header-right">
            <div class="stat-badge" id="level-badge" title="Seviye">
                <span class="stat-icon">🎓</span>
                <span class="stat-value" id="level-text">Çırak</span>
            </div>
            <div class="stat-badge" title="Puan">
                <span class="stat-icon">⭐</span>
                <span class="stat-value" id="score-text">0</span>
            </div>
            <div class="stat-badge" title="Seri">
                <span class="stat-icon">🔥</span>
                <span class="stat-value" id="streak-text">0</span>
            </div>
        </div>
    </header>

    <main class="game-container">
        <section class="definition-card" id="definition-card">
            <p class="definition-label">Tanım:</p>
            <p class="definition-text" id="definition-text">Yükleniyor...</p>
        </section>

        <section class="word-grid" id="word-grid" aria-label="Kelime kutucukları">
        </section>

        <section class="action-buttons">
            <button class="btn btn-primary" id="btn-guess">Tahmin Et</button>
            <button class="btn btn-hint" id="btn-hint">
                Harf Al <span class="hint-count" id="hint-count">Kalan Hak: 3</span>
            </button>
        </section>

        <section class="keyboard" id="keyboard" aria-label="Sanal klavye">
        </section>
    </main>

    <div class="toast" id="toast"></div>

    <footer class="footer">
        <p>Kelime Bilgisi &copy; 2025 &mdash; En Yüksek Seri: <span id="best-streak-text">0</span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
